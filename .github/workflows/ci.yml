name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ -f "package.json" ]; then
            npm test || node tests/*.js || node test.js || true
          else
            node tests/*.js || true
          fi
